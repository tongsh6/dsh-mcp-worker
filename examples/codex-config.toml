# Codex CLI / IDE / ChatGPT 桌面 app 共用 ~/.codex/config.toml
# 把下面这段追加到 config.toml 即可。env 里的路径按需修改。
# 注意：approval_mode 的「不询问」值是 approve；auto 仍会按风险询问（桌面端会弹授权框）。
# 改完需完全退出并重开 Codex/ChatGPT 桌面 app（配置在 app 启动时加载）。

[mcp_servers.dsh]
command = "node"
args = ["C:\\path\\to\\dsh-mcp-worker\\dist\\index.js"]
startup_timeout_sec = 30          # 默认 10；worker 自身启动很快，留余量
tool_timeout_sec = 300            # 默认 60；allow dsh_status 长轮询（wait_s≤120s）
enabled_tools = ["dsh_run", "dsh_status", "dsh_result", "dsh_cancel", "dsh_describe", "dsh_tasks", "dsh_audit", "dsh_read_result", "dsh_batch_run", "dsh_batch_status", "dsh_batch_result", "dsh_search", "dsh_metrics"]
# approve = 不再询问；安全边界由 worker 的 permission_mode（默认 workspace-write）与 fail-closed 审批兜底
default_tools_approval_mode = "approve"

# 每个工具显式 approve（桌面端可被 per-tool 覆盖；13 个工具都要写）
[mcp_servers.dsh.tools.dsh_run]
approval_mode = "approve"

[mcp_servers.dsh.tools.dsh_status]
approval_mode = "approve"

[mcp_servers.dsh.tools.dsh_result]
approval_mode = "approve"

[mcp_servers.dsh.tools.dsh_cancel]
approval_mode = "approve"

[mcp_servers.dsh.tools.dsh_describe]
approval_mode = "approve"

[mcp_servers.dsh.tools.dsh_tasks]
approval_mode = "approve"

[mcp_servers.dsh.tools.dsh_audit]
approval_mode = "approve"

[mcp_servers.dsh.tools.dsh_read_result]
approval_mode = "approve"

[mcp_servers.dsh.tools.dsh_batch_run]
approval_mode = "approve"

[mcp_servers.dsh.tools.dsh_batch_status]
approval_mode = "approve"

[mcp_servers.dsh.tools.dsh_batch_result]
approval_mode = "approve"

[mcp_servers.dsh.tools.dsh_search]
approval_mode = "approve"

[mcp_servers.dsh.tools.dsh_metrics]
approval_mode = "approve"

[mcp_servers.dsh.env]
DSH_MCP_PERMISSION_MODE = "auto"
DSH_MCP_DEFAULT_CWD = "C:\\path\\to\\your\\project"

